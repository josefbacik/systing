name: build

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

# The jobs only build and test; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: Test Suite
    # Not ubuntu-latest: the heap tests need Ubuntu 24.04's Python 3.12, as the
    # runner's python3 and as libpython3.12t64. Ubuntu 26.04 has neither, and
    # apt-get install below fails there before anything is built.
    runs-on: ubuntu-24.04
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common libelf-dev linux-libc-dev clang libbpf-dev make pkg-config jq libjemalloc2 libunwind8 libpython3.12t64
      # The heap tests that ask a Python through its interpreter need a 3.14,
      # and the test that an older one is refused needs the runner's own: the
      # 3.14 is installed beside it, as python3.14, and python3 stays what it
      # was. Both are printed, so the log says what a green run ran.
      # The Go versions systing has bindings for: the gopclntab crate's test
      # builds Go programs with both linkers, and the Go reader's end-to-end
      # check below runs them. Without a Go, both would only say they skip.
      # The second one set up stays on PATH for anything else.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: false
      - run: echo "GO_1_27=$(command -v go)" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.7"
          cache: false
      - name: Install Python 3.14 beside the runner's Python
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.14
          python3 --version
          python3.14 --version
      - name: Install clang 21 (the release build's BPF compiler)
        run: |
          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 21
          clang-21 --version
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Download the pre-built DuckDB library the crate pins
        run: |
          LIBDUCKDB_VERSION="$(scripts/libduckdb-version.sh)"
          echo "libduckdb v${LIBDUCKDB_VERSION} (the DuckDB version Cargo.lock pins)"
          wget -nv "https://github.com/duckdb/duckdb/releases/download/v${LIBDUCKDB_VERSION}/libduckdb-linux-amd64.zip" -O /tmp/libduckdb.zip
          unzip /tmp/libduckdb.zip -d ${{ github.workspace }}/libduckdb
      - name: Run Tests
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          DUCKDB_LIB_DIR: "${{ github.workspace }}/libduckdb"
          DUCKDB_INCLUDE_DIR: "${{ github.workspace }}/libduckdb"
          LD_LIBRARY_PATH: "${{ github.workspace }}/libduckdb"
          SYSTING_BPF_CLANG: "clang-21"
          # The heap tests that run Python under jemalloc fail rather than skip.
          SYSTING_HEAP_REQUIRE_TEST_DEPS: "1"
        run: cargo test --workspace --no-default-features
      # systing-go-profile against the programs' own pprof port and flight
      # recorder, on four builds of its workload (Go's linker and the system
      # linker, each as built and stripped); any build it cannot make fails.
      # The tool reads a workload's memory as the same user, which Yama's
      # default scope allows only to an ancestor of the workload.
      - name: Go reader end to end
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          DUCKDB_LIB_DIR: "${{ github.workspace }}/libduckdb"
          DUCKDB_INCLUDE_DIR: "${{ github.workspace }}/libduckdb"
          LD_LIBRARY_PATH: "${{ github.workspace }}/libduckdb"
          SYSTING_BPF_CLANG: "clang-21"
        run: |
          go version
          "$GO_1_27" version
          cargo build --release --no-default-features -p systing-go-profile
          sudo sysctl -w kernel.yama.ptrace_scope=0
          go-profile/e2e/run.sh
          PATH="$(dirname "$GO_1_27"):$PATH" go-profile/e2e/run.sh

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-common libelf-dev linux-libc-dev clang libbpf-dev make pkg-config jq libjemalloc2 libunwind8
      - name: Install clang 21 (the release build's BPF compiler)
        run: |
          wget -q https://apt.llvm.org/llvm.sh -O /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 21
          clang-21 --version
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
      - name: Download the pre-built DuckDB library the crate pins
        run: |
          LIBDUCKDB_VERSION="$(scripts/libduckdb-version.sh)"
          echo "libduckdb v${LIBDUCKDB_VERSION} (the DuckDB version Cargo.lock pins)"
          wget -nv "https://github.com/duckdb/duckdb/releases/download/v${LIBDUCKDB_VERSION}/libduckdb-linux-amd64.zip" -O /tmp/libduckdb.zip
          unzip /tmp/libduckdb.zip -d ${{ github.workspace }}/libduckdb
      - name: Run Clippy
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          DUCKDB_LIB_DIR: "${{ github.workspace }}/libduckdb"
          DUCKDB_INCLUDE_DIR: "${{ github.workspace }}/libduckdb"
          LD_LIBRARY_PATH: "${{ github.workspace }}/libduckdb"
          SYSTING_BPF_CLANG: "clang-21"
        run: cargo clippy --workspace --no-default-features -- -D warnings
