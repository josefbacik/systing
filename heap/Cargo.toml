[package]
name = "systing-heap"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Reads allocator heap snapshots (jemalloc prof dumps) into a systing DuckDB database"
publish = false

[features]
# Build DuckDB from source, as systing's own default does. CI's
# --no-default-features rows link a prebuilt libduckdb instead; without this
# pass-through the heap crate would switch the bundled build back on for the
# whole workspace.
default = ["duckdb-bundled"]
duckdb-bundled = ["systing/duckdb-bundled"]

[[bin]]
name = "systing-heap"
path = "src/main.rs"

[lib]
name = "systing_heap"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
# Same pin as systing's, so the workspace builds one blazesym.
blazesym = { git = "https://github.com/libbpf/blazesym.git", rev = "8705da0a8cec2bb27f897ac732e27121f9be7936" }
clap = { version = "4.5.20", features = ["derive"] }
duckdb = "1.10504"
libc = "0.2"
regex = "1.11.1"
systing = { path = "..", default-features = false }
tempfile = "3.13"

